---
name: Super-Linter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

permissions: {}

jobs:
  build:
    name: Run Super-Linter
    runs-on: ubuntu-latest
    permissions:
      # contents permission to clone the repository
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false
      - name: Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          VALIDATE_BIOME_LINT: true
          VALIDATE_BIOME_FORMAT: true
          VALIDATE_CHECKOV: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          VALIDATE_GITLEAKS: true
          VALIDATE_JSON: true
          VALIDATE_JSON_PRETTIER: true
          VALIDATE_MARKDOWN: true
          VALIDATE_PRE_COMMIT: true
          # VALIDATE_SPELL_CODESPELL: true
          VALIDATE_YAML: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

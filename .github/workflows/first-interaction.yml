---
name: 🥇 First Interaction

on:
  pull_request:
    types:
      - opened
  issues:
    types:
      - opened

permissions: {}

jobs:
  first-interaction:
    name: 🌓 Greetings Earthling
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: 🏃🏼 Run First Interaction
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d
        with:
          repo_token: '${{ secrets.GITHUB_TOKEN }}'
          issue_message: |
            ## 👋 Welcome to Metropolis Retro!

            Thanks for opening your first issue! 🎉

            We genuinely appreciate you taking the time to contribute to our community.
            A maintainer will review your issue shortly.

            While you wait, feel free to:
            - 📖 Read through our [README](https://github.com/metropolis-retro/metropolis-retro.github.io#readme) to get familiar with the project
            - 💬 Join our community on [Discord](https://discord.gg/hKUH56YHXp) — say hi, ask questions, or share ideas!

            We look forward to working with you! 🕹️
          pr_message: |
            ## 🎉 Your First Pull Request — Welcome!

            Congratulations on opening your first pull request to **Metropolis Retro**! 🚀

            Thank you for contributing — every move counts, and we're thrilled to have you on the board. ♟️

            Here's what happens next:
            - ✅ Our CI checks will run automatically — please ensure they all pass
            - 👀 A maintainer will review your changes as soon as possible
            - 💬 We may leave feedback or request small adjustments — it's all part of the process!

            In the meantime, come hang out with us on [Discord](https://discord.gg/hKUH56YHXp) — the community would love to meet you! 🎮

            Thanks again, and welcome to the team! 🏆
